name: tests
on: [push, pull_request]
jobs:
  todo:
    # Linux (WSL en hermes-win) es donde corre el arnés desde el 20-nov-2026; macOS, donde se desarrolla. Los dos bloquean
    # (en verde desde e42bcdc). Sin identidad de git global a propósito: destapa commits del arnés que dependen de ella.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: runner.os == 'macOS'
        run: brew install jq coreutils || true
      - if: runner.os == 'Linux'
        run: command -v jq >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q jq; }
      - name: Python del plugin (sin Hermes)
        run: |
          python -m pip install -q -r tests/requirements-plugin.txt
          echo "HERMES_PY=$(command -v python)" >> "$GITHUB_ENV"
      # Hermes de verdad (decidido el 25-nov: no un doble del kanban), en la versión que lib/comprobar-hermes.sh da por
      # probada y con las dependencias de su uv.lock; sin gateway, Telegram ni claves. Lo usa tests/simulador.sh (la
      # cadena etapa→puerta→notario→tramo con el kanban real) y tests/hermes-interno.sh.
      - name: Hermes fijado (kanban real para el simulador)
        timeout-minutes: 5
        run: bash .github/scripts/instalar-hermes.sh
      # Un SALTA de tests/cadena.sh o tests/simulador.sh es un fallo en CI (tests/todo.sh), sin excepciones.
      - run: bash tests/todo.sh
      - if: failure()
        run: |
          bash tests/replay-e2e.sh 2>&1 | tail -15 || true
          bash tests/jev.sh 2>&1 | grep -v '^ok' | head -20 || true
          # textos.sh falló una vez solo en macOS (plan fino, preguntas de la FASE-7) y pasó al relanzar: salida entera
          bash tests/textos.sh 2>&1 | grep -v '^ok' | head -80 || true
